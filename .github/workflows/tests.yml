name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sql-translator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run formula_translator tests
        working-directory: solutions/sql_native
        run: python -m pytest test_formula_translator.py -v

  csharp-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Formula.cs tests
        working-directory: solutions/csharp_solution.Tests
        run: dotnet test
